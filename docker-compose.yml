version: '3.8'

services:
  app:
    image: notas-app:latest
    networks:
      - Monadanet
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.notas-app-secure.entrypoints=websecure"
        - "traefik.http.routers.notas-app-secure.rule=Host(`notas.autozapx.com`)"
        - "traefik.http.routers.notas-app-secure.tls=true"
        - "traefik.http.routers.notas-app.entrypoints=web"
        - "traefik.http.routers.notas-app.rule=Host(`notas.autozapx.com`)"
        - "traefik.http.services.notas-app.loadbalancer.server.port=8501"

networks:
  Monadanet:
    external: true
